<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gaeta Prime — Admin</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=DM+Sans:wght@300;400;500&display=swap');

  :root {
    --grafite: #1A1A18;
    --grafite2: #242422;
    --grafite3: #2e2e2b;
    --cobre: #B8955A;
    --cobre-light: #d4ae7a;
    --off: #F5F4F0;
    --off2: #e8e7e3;
    --muted: #888884;
    --error: #c0392b;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--grafite);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'DM Sans', sans-serif;
    position: relative;
    overflow: hidden;
  }

  body::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse 60% 50% at 50% 0%, rgba(184,149,90,0.08) 0%, transparent 70%);
    pointer-events: none;
  }

  .card {
    background: var(--grafite2);
    border: 1px solid rgba(184,149,90,0.15);
    border-radius: 2px;
    padding: 52px 48px 44px;
    width: 100%;
    max-width: 400px;
    position: relative;
    z-index: 1;
  }

  .logo {
    text-align: center;
    margin-bottom: 36px;
  }

  .logo-mark {
    font-family: 'Cormorant Garamond', serif;
    font-size: 28px;
    font-weight: 300;
    color: var(--off);
    letter-spacing: 0.25em;
    text-transform: uppercase;
  }

  .logo-sub {
    font-size: 10px;
    font-weight: 400;
    color: var(--cobre);
    letter-spacing: 0.3em;
    text-transform: uppercase;
    margin-top: 4px;
  }

  .divider {
    width: 32px;
    height: 1px;
    background: var(--cobre);
    margin: 16px auto 0;
    opacity: 0.5;
  }

  .field {
    margin-bottom: 16px;
  }

  label {
    display: block;
    font-size: 11px;
    font-weight: 500;
    color: var(--muted);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  input {
    width: 100%;
    background: var(--grafite3);
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 2px;
    color: var(--off);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    padding: 12px 16px;
    outline: none;
    transition: border-color 0.2s;
  }

  input:focus {
    border-color: rgba(184,149,90,0.4);
  }

  input::placeholder { color: var(--muted); opacity: 0.5; }

  .btn {
    width: 100%;
    background: var(--cobre);
    color: var(--grafite);
    border: none;
    border-radius: 2px;
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    padding: 14px;
    cursor: pointer;
    margin-top: 8px;
    transition: background 0.2s, opacity 0.2s;
  }

  .btn:hover { background: var(--cobre-light); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .error-msg {
    background: rgba(192,57,43,0.1);
    border: 1px solid rgba(192,57,43,0.3);
    border-radius: 2px;
    color: #e74c3c;
    font-size: 12px;
    padding: 10px 14px;
    margin-top: 12px;
    display: none;
  }

  .footer-text {
    text-align: center;
    font-size: 11px;
    color: var(--muted);
    margin-top: 32px;
    opacity: 0.5;
  }
</style>
</head>
<body>

<div class="card">
  <div class="logo">
    <div class="logo-mark">Gaeta Prime</div>
    <div class="logo-sub">Painel Administrativo</div>
    <div class="divider"></div>
  </div>

  <div class="field">
    <label>E-mail</label>
    <input type="email" id="email" placeholder="admin@gaetaprime.com.br" autocomplete="email">
  </div>

  <div class="field">
    <label>Senha</label>
    <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
  </div>

  <button class="btn" id="btnLogin" onclick="handleLogin()">Entrar</button>

  <div class="error-msg" id="errorMsg"></div>

  <p class="footer-text">Acesso restrito — Gaeta Prime © 2025</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = 'https://zdnnbxkewbmedtidoxyd.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_LfqjxNsPGP95e3EyPNcv6Q_G_DJveI4';
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  // Redireciona se já logado
  supabase.auth.getSession().then(({ data }) => {
    if (data.session) window.location.href = 'dashboard.html';
  });

  async function handleLogin() {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const btn = document.getElementById('btnLogin');
    const err = document.getElementById('errorMsg');

    err.style.display = 'none';

    if (!email || !password) {
      showError('Preencha e-mail e senha.');
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Entrando...';

    const { error } = await supabase.auth.signInWithPassword({ email, password });

    if (error) {
      showError('E-mail ou senha incorretos.');
      btn.disabled = false;
      btn.textContent = 'Entrar';
    } else {
      window.location.href = 'dashboard.html';
    }
  }

  function showError(msg) {
    const err = document.getElementById('errorMsg');
    err.textContent = msg;
    err.style.display = 'block';
  }

  // Enter para logar
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter') handleLogin();
  });
</script>
</body>
</html>
